name: Quality Assurance

on:
  workflow_call:
    inputs:
      lua-version:
        required: false
        default: "5.2"
        type: string

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    name: Markdown Quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install linting tools
        run: |
          npm install -g markdownlint-cli

      - name: Lint Markdown files
        run: |
          markdownlint --config .markdownlint.json --dot "**/*.md" || {
            echo "Markdown linting failed"
            echo "Run 'markdownlint --config .markdownlint.json --dot --fix **/*.md' to auto-fix issues"
            exit 1
          }

  jsonlint:
    runs-on: ubuntu-latest
    name: Config Files Quality (including locales)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Donwload validator
        run: |
          curl --location --output validator.tar.gz https://github.com/Boeing/config-file-validator/releases/download/v2.3.0/validator-v2.3-linux-amd64.tar.gz
          tar -xzf validator.tar.gz validator

      - name: Validate config files
        run: |
          ./validator .

  luacheck:
    runs-on: ubuntu-latest
    name: Lua Code Quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "${{ inputs.lua-version }}"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Lint Lua files with luacheck
        run: |
          luacheck . || {
            echo "Lua linting failed"
            echo "Run 'luacheck .' locally to see detailed errors"
            exit 1
          }

  lua-syntax:
    runs-on: ubuntu-latest
    name: Lua Syntax Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "${{ inputs.lua-version }}"

      - name: Check Lua syntax
        run: |
          find . -name "*.lua" -not -path "./.git/*" -not -path "./.lua" -not -path "./.lua/*" -not -path "./.luarocks/*" | while read -r file; do
            echo "Checking syntax: $file"
            if luac -p "$file" 2>/dev/null; then
              echo "$file syntax OK"
            else
              echo "$file has syntax errors:"
              luac -p "$file"
              exit 1
            fi
          done
